{t:'⑧ 맵 아이콘: 🛡 안에 놓으면 공격력↑ · 🚫 설치 불가 · 🐌 적 감속 · 🔥 적 가속. 타워의 ⓘ 버튼에서 상세 능력을 볼 수 있어요.',nx:1},
{t:'🎉 준비 완료! 생명력(❤)이 0이 되면 패배예요. 이제 직접 막아보세요!',nx:1,last:1}];
function tuAsk(){if(!tuGet())$('tupr').style.display='flex'}
function tuNo(){$('tupr').style.display='none';tuSet('skip')}
function tuStart(){if(G)return;if(loadSave()&&!confirm('진행 중인 게임이 있어요.\n튜토리얼을 시작하면 이어하기 기록이 사라져요. 시작할까요?'))return;$('tupr').style.display='none';tuSet('done');lobbyClose();tmFix();start(0,0);G.gold=Math.max(G.gold,900);TUT={on:1,i:0};tuShow()}
function tuShow(){document.querySelectorAll('.tuhl').forEach(e=>e.classList.remove('tuhl'));const s=TUS[TUT.i];if(!s){tuEnd();return}
const el=s.el&&s.el();if(el)el.classList.add('tuhl');$('tut').style.display='block';$('tutn').textContent='🎓 튜토리얼 '+(TUT.i+1)+'/'+TUS.length;$('tutx').innerHTML=s.t;
$('tutnx').style.display=s.nx?'':'none';$('tutnx').textContent=s.last?'시작하기 ▶':'다음 ▶';$('tuth').style.display=s.nx?'none':''}
function tuNext(){TUT.i++;tuShow()}
function tuEnd(){TUT.on=0;document.querySelectorAll('.tuhl').forEach(e=>e.classList.remove('tuhl'));$('tut').style.display='none'}
function tuSkip(){tuEnd()}
function tuTick(){if(!G||G.over){tuEnd();return}const s=TUS[TUT.i];if(s&&s.c&&s.c(G))tuNext()}

// ---------- 진행 중 게임 이어하기 (자동 저장) ----------
const SVK='phd6g',SKIP=new Set(['bg','P','z','bmc','bmk','en','pr','fx','tx','st','sel','po','pk','pause','run','over','win','wv','hm','warn','shake','flash','frz','ov','spd','mi','di','dx','nx','q','cards','hs']);
const hasDom=(x,d=0)=>!!x&&d<3&&(x instanceof Node||(typeof x==='object'&&Object.values(x).some(y=>hasDom(y,d+1))));
let RES=0,lastSnap=0;
function snapSave(){const g=G;if(!g||g.over||g.wv||g.pk||g.en.length||(!g.wave&&!g.tw.length))return;
try{const o={};for(const k of Object.keys(g))if(!SKIP.has(k)&&typeof g[k]!=='function'&&!hasDom(g[k]))o[k]=g[k];localStorage.setItem(SVK,JSON.stringify({v:1,t:Date.now(),mi:g.mi,di:g.di,dx:g.dx||null,g:o}))}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SVK)||'null');if(d&&d.v===1&&MAPS[d.mi]&&d.g&&Array.isArray(d.g.tw)&&d.g.tw.every(t=>T[t.id]))return d}catch(e){}return null}
function clearSave(){try{localStorage.removeItem(SVK)}catch(e){}}
function resumeGame(){const d=loadSave();if(!d||G)return;RES=1;try{start(d.mi,d.di,d.dx||undefined)}finally{RES=0}
Object.assign(G,d.g);G.q=[];G.en=[];G.wv=0;G.pause=0;G.run=1;G.over=0;G.spd=1;G.nx=G.auto?60:0;$('ba').textContent=G.auto?'🔁 자동':'🔁 수동';$('bs').textContent='⏩ 1x';toast('▶ 이어하기: 웨이브 '+(G.wave+1)+' 시작 전')}
function rsmRender(){const e=$('rsm'),d=loadSave();if(!e)return;if(!d||G){e.innerHTML='';return}
const D=d.dx||DF[d.di]||{n:'STAGE'},g=d.g,m=Math.max(1,Math.round((Date.now()-d.t)/60000)),ago=m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전';
e.innerHTML=`<div class="rsc"><div><b>▶ 이어하기</b> · ${D.n} · ${MAPS[d.mi].n}<br><small>웨이브 ${g.wave}/${g.maxW>99?'∞':g.maxW} 클리어 · 타워 ${g.tw.length}개 · $${Math.floor(g.gold)} · ❤${g.lives} · ${ago} 저장<br>다음 웨이브 시작 전 상태로 돌아가요</small></div><div style="display:flex"><button onclick="resumeGame()">▶ 이어하기</button><button class="alt" onclick="rsmDel()" title="기록 삭제">🗑</button></div></div>`}
function rsmDel(){if(confirm('저장된 진행 기록을 삭제할까요?')){clearSave();rsmRender()}}
addEventListener('pagehide',snapSave);document.addEventListener('visibilitychange',()=>{if(document.hidden)snapSave()});

// ---------- 백업 · 복원 (파일 / 코드) ----------
const SKY=['phd6a','phd6b','phd6m','phd6p','phd6d','phd6u','phd6x','phd6t','phd6e','phd6g','phd6tu'];
const jp=v=>{try{return JSON.parse(v)}catch(e){return undefined}};
const isObj=v=>{const o=jp(v);return !!o&&typeof o==='object'&&!Array.isArray(o)};
const isNums=v=>{const o=jp(v);return Array.isArray(o)&&o.length<=100&&o.every(Number.isFinite)};
const SKV={phd6a:isObj,phd6b:isObj,phd6m:isObj,phd6x:isObj,phd6u:isNums,phd6t:isNums,phd6d:v=>/^[\d-]{0,12}$/.test(v),phd6p:v=>/^\d{1,12}(\.\d+)?$/.test(v),phd6e:v=>v==='0'||v==='1',phd6tu:v=>v==='done'||v==='skip',phd6g:v=>{const o=jp(v);return !!o&&o.v===1}};
function bkPack(){const d={};SKY.forEach(k=>{try{const v=localStorage.getItem(k);if(v!=null)d[k]=v}catch(e){}});return{v:2,t:Date.now(),d}}
function bkParse(txt){txt=String(txt||'').trim();let o=jp(txt);if(o===undefined){try{o=jp(decodeURIComponent(escape(atob(txt))))}catch(e){}}
if(!o||typeof o!=='object')return null;const src=o.v===2&&o.d&&typeof o.d==='object'?o.d:o,d={};let n=0;
SKY.forEach(k=>{const v=src[k];if(typeof v==='string'&&v.length<500000&&SKV[k](v)){d[k]=v;n++}});return n?{t:+o.t||0,d}:null}
function bkSummary(r){const b=jp(r.d.phd6b)||{},st=Object.keys(b).filter(k=>b[k]>0).length;return(r.t?new Date(r.t).toLocaleString('ko-KR')+' 저장본\n':'')+`클리어/기록 스테이지 ${st}개 · 방역 포인트 ${r.d.phd6p||0}`+(r.d.phd6g?' · 이어하기 기록 포함':'')}
function bkApply(r){if(!confirm(bkSummary(r)+'\n\n⚠ 이 기기의 현재 기록이 덮어써져요.\n불러올까요?'))return;
SKY.forEach(k=>{try{if(r.d[k]!=null)localStorage.setItem(k,r.d[k])}catch(e){}});alert('불러오기 완료! 새로고침합니다.');location.reload()}
function bkMark(){try{localStorage.setItem('phd6bk',String(Date.now()))}catch(e){}bkLbl()}
async function expFile(){const j=JSON.stringify(bkPack()),name='phd-defense-save-'+new Date().toISOString().slice(0,10)+'.json';
try{const f=new File([j],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'PHD: DEFENSE 저장 파일'});bkMark();bkOpen();return}}catch(e){if(e&&e.name==='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);bkMark();bkOpen()}
function impFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json,text/plain';i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;if(f.size>2e6){alert('파일이 너무 커요. 저장 파일이 맞는지 확인해 주세요.');return}
const r=bkParse(await f.text());if(!r){alert('올바른 저장 파일이 아니에요.');return}bkApply(r)};i.click()}
function expSave(){const c=btoa(unescape(encodeURIComponent(JSON.stringify(bkPack()))));bkMark();(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>alert('저장 코드가 복사되었습니다.\n다른 기기에서 [코드 붙여넣기]에 붙여넣으세요.')).catch(()=>prompt('이 코드를 복사해서 보관하세요',c))}
function impSave(){const c=prompt('저장 코드를 붙여넣으세요');if(!c)return;const r=bkParse(c);if(!r){alert('올바르지 않은 저장 코드입니다.');return}bkApply(r)}
function bkLast(){try{return +localStorage.getItem('phd6bk')||0}catch(e){return 0}}
function bkLbl(){const b=$('bkb');if(!b)return;const has=Object.keys(BS).length>0||RP>0,old=Date.now()-bkLast()>7*864e5;b.textContent='💾 백업·복원'+(has&&old?' ❗':'')}
function bkOpen(){if(G)return;infoOpen();const t=bkLast();
$('inb').innerHTML=`<h2>💾 백업 · 복원</h2><div class="bx">이 기기의 기록(스테이지 진행, 연구, 업적, 팀 편성, 이어하기)을 <b>파일</b>로 저장해 다른 기기로 옮기거나 보관할 수 있어요.<br>파일은 AirDrop · 카카오톡 “나에게 보내기” · 이메일 등으로 옮기세요.</div>
<div class="sec">마지막 백업: ${t?new Date(t).toLocaleString('ko-KR'):'없음'}</div>
<div class="row"><button onclick="expFile()">📤 파일로 저장</button><button onclick="impFile()">📥 파일에서 불러오기</button></div>
<div class="sec">파일이 어려우면 (코드)</div><div class="row"><button class="alt" onclick="expSave()">📋 코드 복사</button><button class="alt" onclick="impSave()">📋 코드 붙여넣기</button></div>
<div class="d">⚠ 불러오면 이 기기의 현재 기록이 덮어써져요. Safari는 오래 방문하지 않으면 저장 데이터를 지울 수 있으니, 가끔 파일로 백업해 두세요.</div>
<div class="ft"><button class="alt" onclick="infoClose()">닫기</button></div>`}
showTitle();icLoop();requestAnimationFrame(loop);
