<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHD: God Mode Master Edition</title>
    <style>
:root{--gold:#ffd54a;--cyan:#35e7ff;--green:#49f5a2;--red:#ff5571;--panel:rgba(8,12,22,.92)}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none;touch-action:none}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,rgba(40,120,255,.12),transparent 38%),linear-gradient(135deg,#02040a,#07101c 55%,#03060c);pointer-events:none}
#game-container{position:relative;width:min(1100px,100vw);margin:0 auto;overflow:visible;padding:8px 10px 110px}
canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 185px);object-fit:contain;background:#07101a;border:1px solid rgba(83,220,255,.45);border-radius:14px;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 35px rgba(0,210,255,.12),inset 0 0 35px rgba(0,0,0,.65);cursor:crosshair;transition:transform .08s}
.status-bar{position:sticky;top:0;z-index:1600;width:min(1100px,100vw);margin:auto;background:rgba(4,8,15,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(83,220,255,.25);padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800;font-size:14px;letter-spacing:.4px;box-shadow:0 8px 25px rgba(0,0,0,.28)}
#stat-text{color:#dcefff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#stat-text::first-letter{color:var(--gold)}
button{border:1px solid rgba(255,255,255,.15);border-radius:10px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(180deg,#172538,#0b1422);padding:10px 16px;transition:.18s;box-shadow:0 5px 16px rgba(0,0,0,.25)}button:hover{transform:translateY(-2px);filter:brightness(1.15)}button:active{transform:scale(.97)}
#wave-btn{background:linear-gradient(135deg,#ffe47b,#f0a51d);color:#15100a;border:1px solid #fff1a8;min-width:145px;box-shadow:0 0 20px rgba(255,195,55,.2)}
#pause-btn,#mute-btn{position:absolute;top:16px;z-index:1001;width:42px;height:42px;padding:0;background:rgba(3,8,15,.72);border-color:rgba(255,255,255,.25);backdrop-filter:blur(8px)}#pause-btn{right:16px}#mute-btn{right:66px}
.shop{position:fixed;z-index:1700;bottom:0;left:0;width:100%;display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,8,15,.78),rgba(2,5,10,.97));backdrop-filter:blur(18px);border-top:1px solid rgba(83,220,255,.3);overflow-x:auto;scrollbar-width:none}.shop::-webkit-scrollbar{display:none}
.tower-card{position:relative;flex:0 0 108px;min-width:108px;height:82px;padding:7px;border-radius:12px;background:linear-gradient(145deg,rgba(19,29,44,.98),rgba(7,12,21,.98));border:1px solid rgba(255,255,255,.12);font-size:10px;text-align:center;cursor:pointer;transition:.18s;box-shadow:inset 0 0 18px rgba(255,255,255,.02)}
.tower-card:hover{transform:translateY(-4px);border-color:rgba(83,220,255,.65)}.tower-card.selected{transform:translateY(-8px);border-color:var(--gold)!important;box-shadow:0 0 22px rgba(255,210,60,.25),inset 0 0 18px rgba(255,210,60,.08)}
.tower-card img{width:42px;height:42px;object-fit:contain;display:block;margin:-2px auto 1px;filter:drop-shadow(0 0 5px rgba(83,220,255,.22));pointer-events:none}.tower-card b{display:block;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tower-card::after{content:"";position:absolute;right:6px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
.overlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;z-index:5000;background:radial-gradient(circle at 50% 45%,rgba(15,43,70,.55),rgba(1,3,8,.96) 65%);backdrop-filter:blur(10px);animation:fadeIn .25s ease}.overlay h1{text-shadow:0 0 25px currentColor}.overlay p{color:#8fa8bf}.overlay button{min-width:180px;margin:6px}.overlay button:hover{box-shadow:0 0 25px rgba(255,213,74,.18)}
#start-screen{position:fixed}.hero-title{font-size:clamp(38px,7vw,78px);letter-spacing:8px;margin:0;color:#f8d35a!important;text-shadow:0 0 12px #f8b83e,0 0 45px rgba(255,170,30,.35);animation:titlePulse 2.8s infinite}.hero-sub{font-size:13px;letter-spacing:4px;text-transform:uppercase;color:#8bb6d2!important}.difficulty-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px}.diff{min-width:145px!important;padding:14px 22px!important}.diff.easy{border-color:#48f2a4;background:linear-gradient(135deg,#164d3b,#0c201b)}.diff.normal{border-color:#f5d75b;background:linear-gradient(135deg,#514718,#201b09);color:#fff}.diff.hard{border-color:#ff657a;background:linear-gradient(135deg,#5b1724,#21090f)}
#alert-banner{position:fixed;top:82px;left:50%;transform:translateX(-50%);background:rgba(12,18,30,.93);color:#fff;padding:11px 22px;border-radius:999px;font-weight:900;z-index:6000;display:none;border:1px solid rgba(83,220,255,.6);box-shadow:0 0 30px rgba(83,220,255,.2);animation:pop .22s ease}
#pause-screen{z-index:5500}#tower-info{font-size:14px;background:rgba(8,15,25,.94);padding:22px;border:1px solid rgba(255,213,74,.65);border-radius:16px;width:min(360px,90vw);text-align:left;line-height:1.65;box-shadow:0 0 45px rgba(255,190,45,.12)}.upgrade-btn{background:linear-gradient(135deg,#ffe36d,#e7a51f);color:#171108;width:100%;margin-top:10px;padding:12px}.sell-btn{background:linear-gradient(135deg,#ff5b72,#a71e39);color:#fff;width:100%;margin-top:6px;padding:10px}
#result-title{font-size:clamp(26px,5vw,52px);text-align:center}.result-chip{color:#9db7ca;letter-spacing:2px}
#dev-panel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(7,12,21,.98);border:1px solid var(--gold);padding:22px;z-index:10000;border-radius:16px;text-align:center;display:none;box-shadow:0 0 50px rgba(255,210,50,.2);width:min(330px,90vw)}.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dev-btn{background:#172333;color:#fff;font-size:12px;padding:10px 5px;border-radius:8px}
@keyframes fadeIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:scale(1)}}@keyframes titlePulse{50%{text-shadow:0 0 18px #f8b83e,0 0 70px rgba(255,170,30,.5)}}@keyframes pop{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@media(max-width:700px){.status-bar{font-size:11px;padding:7px 9px}.status-bar #wave-btn{min-width:105px;padding:8px 9px;font-size:11px}.shop{padding:8px}.tower-card{flex-basis:86px;min-width:86px;height:72px}.tower-card img{width:34px;height:34px}#game-container{padding:5px 5px 94px}canvas{border-radius:10px;max-height:calc(100vh - 145px)}#pause-btn,#mute-btn{top:10px;width:36px;height:36px}#pause-btn{right:10px}#mute-btn{right:52px}.hero-title{letter-spacing:4px}}
    </style>
</head>
<body>

    <div id="dev-panel">
        <h3>🛠️ MASTER DEBUG CONSOLE</h3>
        <div class="dev-grid">
            <button class="dev-btn" onclick="cheatGold()">💰 자금 무한</button>
            <button class="dev-btn" onclick="cheatLives()">❤️ 생명 무적</button>
            <button class="dev-btn" onclick="cheatOneShot()">🔥 원샷원킬</button>
            <button class="dev-btn" onclick="cheatClearWave()">⚡ 웨이브 삭제</button>
            <button class="dev-btn" onclick="setGameSpeed(1)">🏃 1배속</button>
            <button class="dev-btn" onclick="setGameSpeed(2.5)">🚀 2.5배속</button>
        </div>
        <button class="dev-btn" onclick="closeDevPanel()" style="background:#e74c3c; color:white; width:100%; margin-top:15px; border: 1px solid #fff;">닫기</button>
    </div>

    <div id="alert-banner">🚨 알림</div>

    <div id="start-screen" class="overlay" style="display: flex;">
        <h1 onclick="devCheck()" class="hero-title">PHD: DEFENSE</h1>
        <p class="hero-sub">V5 ULTIMATE // GLOBAL DEFENSE COMMAND</p><p style="margin-bottom:18px;">바이러스로부터 인류를 보호하세요.</p>
        <div class="difficulty-wrap">
            <button class="diff easy" onclick="startGame(20)">EASY · 20 WAVE</button>
            <button class="diff normal" onclick="startGame(30)">NORMAL · 30 WAVE</button>
            <button class="diff hard" onclick="startGame(40)">HARD · 40 WAVE</button>
        </div>
        <p style="color:#6f879b;font-size:12px;margin-top:28px;letter-spacing:1px;">💡 화면 아무 곳이나 터치/클릭하면 대기실 음악이 즉시 재생됩니다.</p>
    </div>

    <div id="pause-screen" class="overlay">
        <h1 id="pause-heading" style="color: #f1c40f;">[ 시스템 정지 ]</h1>
        <div id="tower-info-container"></div>
        <button onclick="togglePause()" style="background:#2ecc71; margin-top:20px; width: 200px; height: 50px;">재개하기</button>
    </div>

    <div id="result-screen" class="overlay">
        <h1 id="result-title"></h1>
        <button onclick="location.reload()">다시 시작</button>
    </div>

    <div class="status-bar">
        <div id="stat-text">자금: $2,500 | 생명: 15 | 웨이브: 0 / 0</div>
        <button onclick="startWave()" id="wave-btn">웨이브 시작</button>
    </div>

    <div id="game-container">
        <button id="mute-btn" onclick="toggleMute()">🔊</button>
        <button id="pause-btn" onclick="togglePause()">||</button>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="shop" id="shop"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gold = 2500, lives = 15, wave = 0, maxWaves = 20, gameActive = false, isPaused = false;
        let enemies = [], placedTowers = [], selectedTowerId = null, mousePos = {x:0, y:0}, effects = [], summons = [];
        let shakeAmount = 0, flashAlpha = 0;
        let projectiles = [], ambientParticles = [];
        for(let i=0;i<70;i++) ambientParticles.push({x:Math.random()*800,y:Math.random()*450,r:.5+Math.random()*1.8,a:.15+Math.random()*.4,v:.08+Math.random()*.2});
        let devClickCount = 0, gameSpeed = 1;
        let isMuted = false;
        let currentBgm = null;

        // --- 🎵 오디오 시스템 및 볼륨 설정 ---
        const audioCtx = {
            bgmMain: new Audio('static/sounds/bgm_main.mp3'),
            bgmBattle: new Audio('static/sounds/bgm_battle.mp3'),
            bgmBoss: new Audio('static/sounds/bgm_boss.mp3'),
            shoot: new Audio('static/sounds/shoot.mp3'),
            megaShoot: new Audio('static/sounds/mega_shoot.mp3'),
            upgrade: new Audio('static/sounds/upgrade.mp3'),
            megaBuild: new Audio('static/sounds/mega_build.mp3'),
            victory: new Audio('static/sounds/victory.mp3'),
            defeat: new Audio('static/sounds/defeat.mp3')
        };

        audioCtx.bgmMain.loop = true;  audioCtx.bgmMain.volume = 0.15;
        audioCtx.bgmBattle.loop = true; audioCtx.bgmBattle.volume = 0.15;
        audioCtx.bgmBoss.loop = true;   audioCtx.bgmBoss.volume = 0.2;
        audioCtx.shoot.volume = 0.3;
        audioCtx.megaShoot.volume = 0.5;
        audioCtx.upgrade.volume = 0.6;
        audioCtx.megaBuild.volume = 0.7;
        audioCtx.victory.volume = 0.6;
        audioCtx.defeat.volume = 0.6;

        // BGM 변경 함수
        function switchBGM(newBgm) {
            if (currentBgm === newBgm) return;
            if (currentBgm) currentBgm.pause();

            currentBgm = newBgm;
            if (!isMuted && currentBgm) {
                currentBgm.currentTime = 0;
                currentBgm.play().catch(e => console.log("BGM 재생 보류: ", e));
            }
        }

        // [핵심 변경] 창을 열고 화면 전체(또는 스타트 스크린) 어디든 첫 상호작용이 일어나면 무조건 대기음악 강제 재생
        function initMainBGM() {
            if (!isMuted && !gameActive && currentBgm !== audioCtx.bgmMain) {
                currentBgm = audioCtx.bgmMain;
                currentBgm.play()
                    .then(() => {
                        // 성공적으로 재생되면 이벤트 리스너 제거 (중복 실행 방지)
                        window.removeEventListener('click', initMainBGM);
                        window.removeEventListener('touchstart', initMainBGM);
                    })
                    .catch(e => console.log("브라우저 자동재생 차단 우회 중...", e));
            }
        }
        // 창 열리자마자 사용자가 마우스를 클릭하거나 화면을 터치하는 순간을 감지
        window.addEventListener('click', initMainBGM);
        window.addEventListener('touchstart', initMainBGM);

        function playSound(audioTrack) {
            if (isMuted) return;
            const soundClone = audioTrack.cloneNode();
            soundClone.volume = audioTrack.volume;
            soundClone.play().catch(e => console.log(e));
        }

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) {
                muteBtn.innerText = "🔇";
                if(currentBgm) currentBgm.pause();
            } else {
                muteBtn.innerText = "🔊";
                if (currentBgm && !isPaused) {
                    currentBgm.play().catch(e => console.log(e));
                }
            }
        }

        // --- 경로 설정 ---
        const paths = [
            [{x:0, y:80}, {x:200, y:80}, {x:200, y:180}, {x:400, y:180}, {x:400, y:80}, {x:650, y:80}, {x:650, y:225}, {x:800, y:225}],
            [{x:0, y:370}, {x:250, y:370}, {x:250, y:270}, {x:500, y:270}, {x:500, y:370}, {x:720, y:370}, {x:720, y:225}, {x:800, y:225}]
        ];

        // --- 타워 이미지 로드 ---
        const towerImages = {};
        for(let i=1; i<=15; i++) {
            towerImages[i] = new Image();
            towerImages[i].src = `static/images/tower_${String(i).padStart(2, '0')}.png`;
        }

        const towerNames = ["KF94", "손소독", "자가키트", "열화상", "소독차", "선별소", "조사관", "드라이브", "본부", "치료소", "격리동", "구급단", "집중실", "국가 백신소", "스마트 앰뷸"];
        const towerSpecs = {};

        for(let i=1; i<=15; i++) {
            let baseCost = (i<=5)?300:(i<=10)?1000:3500;
            let finalCost = Math.floor((baseCost + (Math.pow(i, 2.3) * 25)) / 10) * 10;
            if(i === 13) finalCost = 350;
            towerSpecs[i] = {
                id: i, name: towerNames[i-1], cost: finalCost, dmg: 75 + (i * 25),
                range: 155 + (i * 15), fireRate: Math.max(5, 30 - i),
                limit: (i <= 3) ? 15 : (i <= 12) ? 5 : (i === 13) ? 2 : 1,
                isMega: (i >= 14), isBank: (i === 13)
            };
        }
        towerSpecs[14].dmg = 20000;
        towerSpecs[15].dmg = 50000;

        function startGame(waves) {
            maxWaves = waves;
            // 게임을 시작하면 대기실 리스너를 확실하게 지워 안전장치 마련
            window.removeEventListener('click', initMainBGM);
            window.removeEventListener('touchstart', initMainBGM);

            document.getElementById('start-screen').style.display = 'none';
            gameActive = true;
            updateStat();
            updateShopUI();

            // 일반 전투 음악으로 전환
            switchBGM(audioCtx.bgmBattle);
            draw();
        }

        function togglePause() {
            if(!gameActive) return;
            isPaused = !isPaused;
            document.getElementById('pause-screen').style.display = isPaused ? 'flex' : 'none';
            if (!isMuted && currentBgm) {
                if (isPaused) currentBgm.pause();
                else currentBgm.play().catch(e => console.log(e));
            }
        }

        function devCheck() {
            devClickCount++;
            if (devClickCount >= 5) {
                document.getElementById('dev-panel').style.display = 'block';
                showAlert("🔓 마스터 디버그 패널 활성화!");
                devClickCount = 0;
            }
        }

        function cheatGold() { gold = 99999999; updateStat(); showAlert("💰 자금이 무한으로 설정되었습니다."); }
        function cheatClearWave() { enemies = []; showAlert("⚡ 현재 웨이브의 바이러스를 박멸했습니다."); }
        function cheatLives() { lives = 9999; updateStat(); showAlert("❤️ 방역 생명력이 무적으로 설정되었습니다."); }
        function cheatOneShot() {
            placedTowers.forEach(t => { t.dmg = 99999999; });
            for(let id in towerSpecs) { towerSpecs[id].dmg = 99999999; }
            showAlert("🔥 모든 타워가 즉사 데미지로 변경되었습니다.");
        }
        function setGameSpeed(s) { gameSpeed = s; showAlert(`🚀 게임 속도가 ${s}배속으로 설정되었습니다.`); }
        function closeDevPanel() { document.getElementById('dev-panel').style.display = 'none'; }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (800 / rect.width);
            mousePos.y = (e.clientY - rect.top) * (450 / rect.height);
        });

        function startWave() {
            if(!gameActive || enemies.length > 0) return;
            wave++;

            if (wave % 10 === 0) {
                showAlert(`🚨 WARNING: 보스 웨이브 돌입!!`);
                switchBGM(audioCtx.bgmBoss);
            } else {
                switchBGM(audioCtx.bgmBattle);
            }

            gold += (300 + (wave * 50) + placedTowers.filter(t=>t.isBank).length * 800);
            updateStat();
            let count = 0;
            let spawnInterval = setInterval(() => {
                if(isPaused) return;
                const pIdx = Math.floor(Math.random() * 2);
                const rand = Math.random();
                let type = "인플루엔자", hpMult = 1, speed = 2.4, color = "lime", size = 28, bounty = 20;

                if (wave % 10 === 0 && count === 0) { type = "COVID-19"; hpMult = 45; speed = 0.9; color = "red"; size = 65; bounty = 1500; }
                else if (rand < 0.2) { type = "노로바이러스"; hpMult = 0.5; speed = 4.8; color = "yellow"; size = 22; bounty = 15; }
                else if (rand < 0.4) { type = "에볼라"; hpMult = 3.5; speed = 1.1; color = "purple"; size = 35; bounty = 50; }

                enemies.push({
                    pIdx, node: 0, x: paths[pIdx][0].x, y: paths[pIdx][0].y,
                    hp: 160 * Math.pow(1.35, wave) * hpMult, maxHp: 160 * Math.pow(1.35, wave) * hpMult,
                    speed, size, type, color, bounty
                });
                if (++count >= 10 + wave) clearInterval(spawnInterval);
            }, 600 / gameSpeed);
        }

        function upgradeTower(idx) {
            const t = placedTowers[idx];
            if(t.level >= 3) return;
            const upgradeCost = Math.floor(t.cost * (t.level === 1 ? 2.5 : 4.0));
            if(gold < upgradeCost) { showAlert(`자금 부족! ($${upgradeCost})`); return; }
            gold -= upgradeCost; t.totalSpent += upgradeCost; t.level++;
            t.dmg *= t.isMega ? 5.0 : 2.5;
            t.fireRate *= 0.6;
            if(t.isMega) shakeAmount = 30;
            effects.push({ x: t.x, y: t.y, r: 10, maxR: t.isMega?300:100, type: 'upgrade', alpha: 1 });
            playSound(audioCtx.upgrade);
            updateStat(); togglePause();
        }

        function sellTower(idx) {
            const t = placedTowers[idx]; gold += Math.floor(t.totalSpent * 0.7);
            placedTowers.splice(idx, 1);
            updateStat(); updateShopUI(); togglePause();
        }

        function draw() {
            if(!gameActive) return;
            for(let step=0; step < (isPaused ? 0 : gameSpeed === 2.5 ? 3 : 1); step++) {
                updateGame();
            }
            render();
            requestAnimationFrame(draw);
        }

        function updateGame() {
            if(shakeAmount > 0) {
                canvas.style.transform = `translate(${(Math.random()-0.5)*shakeAmount}px, ${(Math.random()-0.5)*shakeAmount}px)`;
                shakeAmount *= 0.9;
            } else { canvas.style.transform = `translate(0,0)`; }

            ctx.font="700 11px Inter,Arial";ctx.fillStyle="rgba(170,220,240,.42)";ctx.textAlign="left";ctx.fillText("V5 ULTIMATE // DEFENSE GRID",18,22);ctx.textAlign="right";ctx.fillText(`WAVE ${wave}/${maxWaves}`,782,22);

            if(flashAlpha > 0) flashAlpha -= 0.05;

            let wasEnemyBefore = enemies.length > 0;

            enemies = enemies.filter(e => {
                let target = paths[e.pIdx][e.node + 1], dist = Math.hypot(target.x - e.x, target.y - e.y);
                if(dist < e.speed) {
                    if(++e.node >= paths[e.pIdx].length - 1) {
                        lives--;
                        updateStat();
                        return false;
                    }
                }
                else { e.x += (target.x - e.x) / dist * e.speed; e.y += (target.y - e.y) / dist * e.speed; }
                if(e.hp <= 0) { gold += e.bounty; effects.push({x:e.x,y:e.y,r:5,maxR:e.size*1.8,type:"death",alpha:1}); flashAlpha=Math.min(.18,flashAlpha+.04); updateStat(); return false; }
                return true;
            });

            if(wasEnemyBefore && enemies.length === 0 && gameActive && wave % 10 === 0) {
                switchBGM(audioCtx.bgmBattle);
            }

            summons = summons.filter(s => {
                let targetNode = paths[s.pIdx][s.node - 1];
                let dist = Math.hypot(targetNode.x - s.x, targetNode.y - s.y);
                if (dist < s.speed) { s.node--; if (s.node <= 0) return false; }
                else { s.x += (targetNode.x - s.x) / dist * s.speed; s.y += (targetNode.y - s.y) / dist * s.speed; }
                let hitEnemy = enemies.find(e => Math.hypot(e.x - s.x, e.y - s.y) < 30);
                if (hitEnemy) {
                    hitEnemy.hp -= s.dmg;
                    shakeAmount = 10;
                    effects.push({ x: s.x, y: s.y, r: 10, maxR: 120, type: 'mega', alpha: 1 });
                    playSound(audioCtx.megaShoot);
                    return false;
                }
                return true;
            });

            placedTowers.forEach(t => {
                if(t.isBank) return;
                if(t.cooldown > 0) t.cooldown--;
                else {
                    if(t.id === 15) {
                        const pIdx = Math.floor(Math.random() * 2);
                        const lastNodeIdx = paths[pIdx].length - 1;
                        summons.push({ x: paths[pIdx][lastNodeIdx].x, y: paths[pIdx][lastNodeIdx].y, pIdx, node: lastNodeIdx, speed: 5 + (t.level * 2), dmg: t.dmg, color: "#00ffff" });
                        t.cooldown = t.fireRate * 3;
                        playSound(audioCtx.shoot);
                    } else {
                        let target = enemies.find(e => Math.hypot(e.x-t.x, e.y-t.y) < t.range);
                        if(target) {
                            let currentDmg = t.dmg;
                            if(t.isMega && Math.random() < 0.2) {
                                currentDmg *= 15; flashAlpha = 0.4; shakeAmount = 20;
                                playSound(audioCtx.megaShoot);
                            } else {
                                playSound(t.isMega ? audioCtx.megaShoot : audioCtx.shoot);
                            }
                            target.hp -= currentDmg;
                            projectiles.push({x:t.x,y:t.y,tx:target.x,ty:target.y,life:0,max:7,mega:t.isMega});
                            t.lastTarget = {x: target.x, y: target.y};
                            t.cooldown = t.fireRate;
                            t.effectTimer = 6;
                            if(t.isMega) {
                                enemies.forEach(nearE => { if(nearE !== target && Math.hypot(nearE.x - target.x, nearE.y - target.y) < 120) nearE.hp -= currentDmg * 0.6; });
                                effects.push({ x: target.x, y: target.y, r: 10, maxR: 130, type: 'mega', alpha: 1 });
                            } else {
                                effects.push({ x: target.x, y: target.y, r: 2, maxR: 25, type: 'hit', alpha: 1 });
                                for(let i=0; i<3; i++) effects.push({ x: target.x, y: target.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, r: 3, type: 'particle', alpha: 1, color: t.id <= 5 ? "#2ecc71" : "#f1c40f" });
                            }
                        }
                    }
                }
            });

            projectiles = projectiles.filter(p => { p.life++; p.x += (p.tx-p.x)*0.34; p.y += (p.ty-p.y)*0.34; return p.life < p.max; });

            effects = effects.filter(fx => {
                if(fx.type === 'particle') { fx.x += fx.vx; fx.y += fx.vy; fx.alpha -= 0.05; }
                else { fx.r += (fx.type==='hit'? 3 : fx.type==='mega'? 15 : fx.type==='death'? 6 : 3); fx.alpha -= 0.04; }
                return fx.alpha > 0;
            });
        }

        function render() {
            ctx.fillStyle = "#07101a"; ctx.fillRect(0,0,800,450);
            const grd=ctx.createRadialGradient(400,210,40,400,210,520); grd.addColorStop(0,"rgba(24,73,100,.18)"); grd.addColorStop(1,"rgba(0,0,0,.35)"); ctx.fillStyle=grd; ctx.fillRect(0,0,800,450);
            ctx.strokeStyle="rgba(80,170,210,.055)"; ctx.lineWidth=1; for(let x=0;x<=800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,450);ctx.stroke()} for(let y=0;y<=450;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}
            ambientParticles.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=450;ctx.globalAlpha=p.a;ctx.fillStyle="#72dfff";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
            paths.forEach(p => {
                ctx.shadowBlur = 15; ctx.shadowColor = "rgba(255, 255, 255, 0.4)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 40; ctx.lineJoin = "round"; ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); p.forEach(pt => ctx.lineTo(pt.x, pt.y)); ctx.stroke();
                ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(255, 255, 255, 0.08)"; ctx.lineWidth = 45; ctx.stroke();
            });

            ctx.font="700 11px Inter,Arial";ctx.fillStyle="rgba(170,220,240,.42)";ctx.textAlign="left";ctx.fillText("V5 ULTIMATE // DEFENSE GRID",18,22);ctx.textAlign="right";ctx.fillText(`WAVE ${wave}/${maxWaves}`,782,22);

            if(flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0,0,800,450); }

            summons.forEach(s => {
                ctx.fillStyle = s.color; ctx.shadowBlur = 15; ctx.shadowColor = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            });

            projectiles.forEach(p=>{ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.mega?"#35e7ff":"#ffe66d";ctx.shadowBlur=p.mega?18:10;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(p.x,p.y,p.mega?5:3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;});

            effects.forEach(fx => {
                ctx.beginPath();
                if(fx.type === 'particle') {
                    ctx.arc(fx.x, fx.y, fx.r, 0, Math.PI*2);
                    ctx.fillStyle = fx.color; ctx.globalAlpha = fx.alpha; ctx.fill(); ctx.globalAlpha = 1.0;
                } else {
                    ctx.arc(fx.x, fx.y, Math.abs(fx.r), 0, Math.PI*2);
                    ctx.strokeStyle = fx.type === 'upgrade' ? `rgba(241, 196, 15, ${fx.alpha})` : fx.type === 'mega' ? `rgba(0, 255, 255, ${fx.alpha})` : fx.type === 'death' ? `rgba(255, 80, 110, ${fx.alpha})` : `rgba(255, 255, 255, ${fx.alpha})`;
                    ctx.lineWidth = fx.type === 'mega' ? 8 : 2; ctx.stroke();
                }
            });

            placedTowers.forEach(t => {
                const size = t.isMega ? 90 : 50;
                if(Math.hypot(t.x - mousePos.x, t.y - mousePos.y) < size/2) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
                    ctx.fillStyle = t.isMega ? "rgba(0, 255, 255, 0.1)" : "rgba(46, 204, 113, 0.1)"; ctx.fill();
                    ctx.strokeStyle = t.isMega ? "rgba(0, 255, 255, 0.4)" : "rgba(46, 204, 113, 0.4)"; ctx.stroke();
                }
                if(t.isMega) {
                    ctx.shadowBlur = 25; ctx.shadowColor = "#00ffff";
                    ctx.beginPath(); ctx.arc(t.x, t.y, 55, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${0.4 + Math.sin(Date.now()/100)*0.3})`; ctx.lineWidth = 4; ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                const img = towerImages[t.id];
                if(img.complete && img.naturalWidth !== 0) ctx.drawImage(img, t.x - size/2, t.y - size/2, size, size);
                else { ctx.fillStyle = t.isMega ? "#00ffff" : "#2ecc71"; ctx.fillRect(t.x - size/2, t.y - size/2, size, size); }
                ctx.fillStyle = "#f1c40f"; ctx.font = "bold 16px Arial"; ctx.textAlign="center"; ctx.fillText("★".repeat(t.level), t.x, t.y - size/2 - 10);
                if(t.effectTimer > 0) {
                    ctx.beginPath(); ctx.strokeStyle = t.isMega ? "#00ffff" : "#2ecc71"; ctx.lineWidth = t.isMega ? 8 : 2;
                    ctx.moveTo(t.x, t.y); ctx.lineTo(t.lastTarget.x, t.lastTarget.y); ctx.stroke();
                    t.effectTimer--;
                }
            });

            if(selectedTowerId) {
                const spec = towerSpecs[selectedTowerId];
                const size = spec.isMega ? 90 : 50;
                ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, spec.range, 0, Math.PI*2);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.3)"; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
                ctx.globalAlpha = 0.5;
                const img = towerImages[selectedTowerId];
                if(img.complete && img.naturalWidth !== 0) ctx.drawImage(img, mousePos.x-size/2, mousePos.y-size/2, size, size);
                else { ctx.fillStyle = "#fff"; ctx.fillRect(mousePos.x-size/2, mousePos.y-size/2, size, size); }
                ctx.globalAlpha = 1.0;
            }

            enemies.forEach(e => {
                ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2); ctx.fill();
                const barW = e.type === "COVID-19" ? 70 : 30;
                ctx.fillStyle = "#333"; ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 12, barW, 7);
                ctx.fillStyle = e.type === "COVID-19" ? "#ff00ff" : "#0f0";
                ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 12, barW * (e.hp/e.maxHp), 7);
            });

            if(lives <= 0) endGame("방역 실패: 변이 바이러스가 확산되었습니다.", false);
            if(wave >= maxWaves && enemies.length === 0 && gameActive) endGame("방역 대성공: 인류를 구했습니다!", true);
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect(), x = (e.clientX - rect.left) * (800 / rect.width), y = (e.clientY - rect.top) * (450 / rect.height);
            let tIdx = placedTowers.findIndex(t => Math.hypot(t.x - x, t.y - y) < (t.isMega?55:25));
            if(tIdx !== -1) {
                const t = placedTowers[tIdx], nextCost = Math.floor(t.cost * (t.level === 1 ? 2.5 : 4.0));
                isPaused = true; document.getElementById('pause-screen').style.display = 'flex';
                if (!isMuted && currentBgm) currentBgm.pause();

                document.getElementById('tower-info-container').innerHTML = `
                    <div id="tower-info">
                        <b style="font-size:20px; color:${t.isMega?'#00ffff':'#2ecc71'};">${t.isMega?'🔥 MEGA UNIT 🔥':''} ${t.name}</b><br>
                        ${t.id === 15 ? '기능: 방역 요원 역출동' : '데미지: ' + Math.floor(t.dmg).toLocaleString()}<br>
                        레벨: ${t.level} / 3<br>
                        <button class="upgrade-btn" onclick="upgradeTower(${tIdx})" ${t.level>=3?'disabled':''}>
                            ${t.level>=3?'업그레이드 완료':'성능 한계 돌파 ($'+nextCost+')'}
                        </button>
                        <button class="sell-btn" onclick="sellTower(${tIdx})">데이터 삭제 (철거)</button>
                    </div>`;
                return;
            }
            if(selectedTowerId) {
                const spec = towerSpecs[selectedTowerId];
                if(gold >= spec.cost) {
                    gold -= spec.cost;
                    if(spec.isMega) {
                        shakeAmount = 50; flashAlpha = 0.5; showAlert("☢️ 메가 타워가 배치되었습니다!");
                        playSound(audioCtx.megaBuild);
                    }
                    placedTowers.push({ ...spec, x, y, level: 1, cooldown: 0, effectTimer: 0, totalSpent: spec.cost });
                    selectedTowerId = null; updateStat(); updateShopUI();
                } else { showAlert("예산이 부족합니다!"); }
            }
        });

        function updateShopUI() {
            const shopUI = document.getElementById('shop'); shopUI.innerHTML = "";
            for(let i=1; i<=15; i++) {
                const count = placedTowers.filter(t => t.id === i).length, spec = towerSpecs[i], card = document.createElement('div');
                card.className = `tower-card ${selectedTowerId === i ? 'selected' : ''}`;
                if(spec.isMega) card.style.borderColor = "#00ffff";
                card.innerHTML = `<img src="${towerImages[i].src}" onerror="this.src='https://via.placeholder.com/40/2ecc71/fff?text=${i}'"><b>${spec.name}</b><br>$${spec.cost}`;
                card.onclick = (e) => {
                    if(count < spec.limit) { selectedTowerId = (selectedTowerId === i ? null : i); updateShopUI(); }
                    else { showAlert("건설 제한 초과!"); }
                    e.stopPropagation();
                };
                shopUI.appendChild(card);
            }
        }

        function showAlert(m) { const b = document.getElementById('alert-banner'); b.innerText = m; b.style.display='block'; setTimeout(()=>b.style.display='none', 2500); }
        function updateStat() { document.getElementById('stat-text').innerText = `자금: $${gold.toLocaleString()} | 생명: ${lives} | 웨이브: ${wave} / ${maxWaves}`; }

        function endGame(text, isVictory) {
            gameActive = false;
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('result-title').innerText = text;

            if(currentBgm) currentBgm.pause();
            if(isVictory) playSound(audioCtx.victory);
            else playSound(audioCtx.defeat);
        }
    </script>
</body>
</html>
