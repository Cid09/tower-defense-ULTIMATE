<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHD: DEFENSE — V5 ULTIMATE</title>
    <style>
        body { text-align: center; background: #000; color: white; margin: 0; font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none; user-select: none; }
        #game-container { position: relative; width: 800px; margin: 0 auto; overflow: hidden; }
        canvas { background: #050505; border: 3px solid #2ecc71; display: block; max-width: 100%; height: auto; cursor: crosshair; transition: transform 0.1s; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 2000; background: rgba(0,0,0,0.85); }
        .status-bar { background: #111; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #2ecc71; font-weight: bold; font-size: 18px; }
        #stat-text { letter-spacing: 1px; }
        #alert-banner { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(231, 76, 60, 0.9); color: white; padding: 12px 30px; border-radius: 5px; font-weight: bold; z-index: 1500; display: none; border: 2px solid #fff; }
        .shop { display: flex; gap: 8px; background: #000; padding: 15px; width: 100%; overflow-x: auto; border-top: 2px solid #444; position: fixed; bottom: 0; left: 0; }
        .tower-card { background: #1a1a1a; padding: 8px; border-radius: 8px; min-width: 95px; border: 2px solid #333; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .tower-card.selected { border-color: #f1c40f; background: #222200; transform: translateY(-5px); }
        .tower-card img { width: 40px; height: 40px; display: block; margin: 0 auto 5px; pointer-events: none; }
        button { cursor: pointer; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; background: #2ecc71; color: white; margin: 5px; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        #wave-btn { background: #fff; color: #000; font-size: 16px; padding: 10px 25px; border: 2px solid #2ecc71; }
        #pause-btn { position: absolute; top: 10px; right: 10px; z-index: 1001; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border: 1px solid #fff; color: white; }
        #tower-info { font-size: 15px; background: rgba(255, 215, 0, 0.1); padding: 20px; border: 1px solid #f1c40f; border-radius: 10px; width: 320px; text-align: left; line-height: 1.6; }
        .upgrade-btn { background: #f1c40f; color: #000; width: 100%; margin-top: 10px; padding: 12px; font-weight: bold; }
        .sell-btn { background: #e74c3c; color: #fff; width: 100%; margin-top: 5px; padding: 10px; font-weight: bold; }
        #dev-panel { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(17, 17, 17, 0.98); border: 2px solid #f1c40f; padding: 20px; z-index: 10000; border-radius: 12px; text-align: center; display: none; box-shadow: 0 0 30px #f1c40f; width: 300px; }
        .dev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .dev-btn { background: #f1c40f; color: black; font-size: 12px; padding: 10px 5px; border-radius: 4px; font-weight: bold; }
        #mute-btn { position: absolute; top: 10px; right: 60px; z-index: 1001; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border: 1px solid #fff; color: white; font-size: 16px; }
    
/* ================= V5 ULTIMATE VISUAL OVERHAUL ================= */
:root{--cyan:#5df7ff;--green:#55ff9a;--gold:#ffd45a;--red:#ff5470;--panel:rgba(7,12,22,.88);--line:rgba(93,247,255,.25)}
*{box-sizing:border-box}
body{background:radial-gradient(circle at 50% 0%,#12223b 0,#05070c 42%,#020308 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.2px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(93,247,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(93,247,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(to bottom,black,transparent 85%);z-index:-1}
#game-container{width:min(1100px,100vw);padding:0 10px;}
canvas{width:100%;height:auto;aspect-ratio:16/9;border:1px solid rgba(93,247,255,.7);border-radius:16px;background:#03070d;box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 0 35px rgba(0,220,255,.18),0 20px 60px rgba(0,0,0,.45);cursor:crosshair}
.status-bar{position:sticky;top:0;z-index:1200;background:linear-gradient(180deg,rgba(10,17,30,.96),rgba(5,9,17,.92));backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#stat-text{font-weight:800;font-size:14px;text-shadow:0 0 12px rgba(93,247,255,.25)}
#alert-banner{top:78px;background:linear-gradient(90deg,rgba(20,50,65,.97),rgba(8,18,30,.97));border:1px solid var(--cyan);box-shadow:0 0 25px rgba(93,247,255,.25);border-radius:999px;padding:10px 22px;backdrop-filter:blur(10px)}
button{background:linear-gradient(135deg,#25d99a,#0ea77a);border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 20px rgba(0,0,0,.25),0 0 18px rgba(37,217,154,.12);border-radius:10px;transition:transform .16s,filter .16s,box-shadow .16s}
button:hover{opacity:1;transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 10px 26px rgba(0,0,0,.3),0 0 24px rgba(93,247,255,.18)}
#start-screen{background:radial-gradient(circle at 50% 35%,rgba(15,66,85,.45),rgba(2,4,9,.96) 55%);overflow:hidden}
#start-screen:before{content:"";position:absolute;width:620px;height:620px;border:1px solid rgba(93,247,255,.14);border-radius:50%;box-shadow:0 0 100px rgba(0,220,255,.1) inset;animation:spin 18s linear infinite}
#start-screen h1{position:relative;font-size:clamp(42px,7vw,76px)!important;letter-spacing:6px;text-shadow:0 0 12px #ffd45a,0 0 45px rgba(255,212,90,.35);animation:titlePulse 2.8s ease-in-out infinite}
#start-screen p,#start-screen div{position:relative;z-index:2}
#start-screen button{min-width:140px;padding:15px 22px!important;font-size:15px;border-radius:14px}
.shop{position:fixed;bottom:0;left:0;width:100%;padding:10px max(10px,calc((100vw - 1100px)/2));background:linear-gradient(180deg,rgba(2,5,10,.72),rgba(2,5,10,.97));border-top:1px solid rgba(93,247,255,.25);backdrop-filter:blur(16px);z-index:1300;gap:9px;scrollbar-width:thin}
.tower-card{min-width:88px;background:linear-gradient(180deg,rgba(20,29,43,.95),rgba(8,13,21,.95));border:1px solid rgba(255,255,255,.1);padding:8px 7px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);position:relative;overflow:hidden}
.tower-card:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(93,247,255,.08),transparent);transform:translateX(-100%);transition:.35s}
.tower-card:hover:after{transform:translateX(100%)}
.tower-card.selected{border-color:var(--gold);background:linear-gradient(180deg,rgba(65,56,18,.9),rgba(20,18,8,.95));box-shadow:0 0 22px rgba(255,212,90,.2);transform:translateY(-6px)}
.tower-card img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 7px rgba(93,247,255,.12))}
#pause-screen,#result-screen{background:radial-gradient(circle at center,rgba(10,25,38,.78),rgba(0,0,0,.92));backdrop-filter:blur(10px)}
#tower-info{background:linear-gradient(145deg,rgba(20,30,43,.98),rgba(5,10,18,.98));border:1px solid var(--gold);box-shadow:0 0 35px rgba(255,212,90,.16);width:min(360px,90vw);border-radius:18px}
#dev-panel{background:linear-gradient(145deg,rgba(17,25,38,.99),rgba(4,8,15,.99));border-color:var(--gold);box-shadow:0 0 45px rgba(255,212,90,.2)}
#mute-btn,#pause-btn{background:rgba(7,14,24,.75);border:1px solid rgba(255,255,255,.25);border-radius:10px;backdrop-filter:blur(8px)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes titlePulse{50%{transform:scale(1.025);text-shadow:0 0 18px #ffd45a,0 0 70px rgba(255,212,90,.45)}}
@keyframes blink{50%{opacity:.35}}
@media(max-width:700px){.status-bar{font-size:12px;padding:8px}.status-bar #stat-text{font-size:11px;white-space:nowrap;overflow:hidden}.status-bar #wave-btn{font-size:12px;padding:8px 10px}.shop{padding:7px}.tower-card{min-width:72px;font-size:9px}.tower-card img{width:36px;height:36px}#pause-btn,#mute-btn{top:7px;width:34px;height:34px;padding:0}.shop{gap:6px}}


/* V5 ULTIMATE MOBILE COMMAND DECK */
html{background:#020308;min-height:100%;}
body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);}
button,.tower-card{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.shop{padding-bottom:max(8px,env(safe-area-inset-bottom));}
@media (max-width:700px){
  body{overflow:hidden;}
  #game-container{width:100vw;padding:0 5px;}
  canvas{width:100%;max-height:calc(100dvh - 145px);object-fit:contain;border-radius:10px;}
  .status-bar{position:relative;min-height:42px;box-sizing:border-box;}
  .status-bar #stat-text{max-width:58vw;}
  #alert-banner{top:62px;max-width:86vw;font-size:12px;padding:9px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .shop{max-height:116px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;}
  .tower-card{flex:0 0 auto;min-width:82px;min-height:76px;padding:7px 6px;scroll-snap-align:start;}
  .tower-card img{width:38px;height:38px;}
  #pause-screen,#result-screen{padding:12px;}
  #tower-info{font-size:13px;padding:15px;max-height:72dvh;overflow:auto;}
  #pause-screen button{min-height:48px;}
}
@media (max-width:700px) and (orientation:landscape){
  .status-bar{padding:5px 8px;min-height:36px;}
  canvas{max-height:calc(100dvh - 108px);}
  .shop{max-height:82px;padding-top:5px;}
  .tower-card{min-width:74px;min-height:62px;padding:4px;}
  .tower-card img{width:30px;height:30px;}
}

</style>
</head>
<body>

    <div id="dev-panel">
        <h3>🛠️ MASTER DEBUG CONSOLE</h3>
        <div class="dev-grid">
            <button class="dev-btn" onclick="cheatGold()">💰 자금 무한</button>
            <button class="dev-btn" onclick="cheatLives()">❤️ 생명 무적</button>
            <button class="dev-btn" onclick="cheatOneShot()">🔥 원샷원킬</button>
            <button class="dev-btn" onclick="cheatClearWave()">⚡ 웨이브 삭제</button>
            <button class="dev-btn" onclick="setGameSpeed(1)">🏃 1배속</button>
            <button class="dev-btn" onclick="setGameSpeed(2.5)">🚀 2.5배속</button>
        </div>
        <button class="dev-btn" onclick="closeDevPanel()" style="background:#e74c3c; color:white; width:100%; margin-top:15px; border: 1px solid #fff;">닫기</button>
    </div>

    <div id="alert-banner">🚨 알림</div>

    <div id="start-screen" class="overlay" style="display: flex;">
        <h1 onclick="devCheck()" style="color: #f1c40f; font-size: 48px; cursor: pointer; margin-bottom: 10px;">PHD: DEFENSE</h1><div style="color:#5df7ff;font-weight:800;letter-spacing:5px;font-size:12px;margin-bottom:14px;">V5 ULTIMATE // BATTLE PROTOCOL</div>
        <p style="color: #aaa; margin-bottom: 30px;">바이러스로부터 인류를 보호하세요.</p>
        <div>
            <button onclick="startGame(20)" style="background:#27ae60; padding: 15px 30px;">초급 (20W)</button>
            <button onclick="startGame(30)" style="background:#f1c40f; color:#000; padding: 15px 30px;">중급 (30W)</button>
            <button onclick="startGame(40)" style="background:#e74c3c; padding: 15px 30px;">전문 (40W)</button>
        </div>
        <p style="color: #666; font-size: 13px; margin-top: 25px; animation: blink 1.5s infinite;">💡 화면 아무 곳이나 터치/클릭하면 대기실 음악이 즉시 재생됩니다.</p>
    </div>

    <div id="pause-screen" class="overlay">
        <h1 id="pause-heading" style="color: #f1c40f;">[ 시스템 정지 ]</h1>
        <div id="tower-info-container"></div>
        <button onclick="togglePause()" style="background:#2ecc71; margin-top:20px; width: 200px; height: 50px;">재개하기</button>
    </div>

    <div id="result-screen" class="overlay">
        <h1 id="result-title"></h1>
        <button onclick="location.reload()">다시 시작</button>
    </div>

    <div class="status-bar">
        <div id="stat-text">자금: $2,500 | 생명: 15 | 웨이브: 0 / 0</div>
        <button onclick="startWave()" id="wave-btn">웨이브 시작</button>
    </div>

    <div id="game-container">
        <button id="mute-btn" onclick="toggleMute()">🔊</button>
        <button id="pause-btn" onclick="togglePause()">||</button>
        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <div class="shop" id="shop"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gold = 2500, lives = 15, wave = 0, maxWaves = 20, gameActive = false, isPaused = false;
        let enemies = [], placedTowers = [], selectedTowerId = null, mousePos = {x:0, y:0}, effects = [], summons = [], projectiles = [];
        let ambientParticles = Array.from({length:85},()=>({x:Math.random()*800,y:Math.random()*450,r:Math.random()*1.8+.3,v:Math.random()*.35+.08,a:Math.random()*.45+.12}));
        let shakeAmount = 0, flashAlpha = 0;
        let devClickCount = 0, gameSpeed = 1;
        let isMuted = false;
        let currentBgm = null;

        // --- 🎵 오디오 시스템 및 볼륨 설정 ---
        const audioCtx = {
            bgmMain: new Audio('static/sounds/bgm_main.mp3'),
            bgmBattle: new Audio('static/sounds/bgm_battle.mp3'),
            bgmBoss: new Audio('static/sounds/bgm_boss.mp3'),
            shoot: new Audio('static/sounds/shoot.mp3'),
            megaShoot: new Audio('static/sounds/mega_shoot.mp3'),
            upgrade: new Audio('static/sounds/upgrade.mp3'),
            megaBuild: new Audio('static/sounds/mega_build.mp3'),
            victory: new Audio('static/sounds/victory.mp3'),
            defeat: new Audio('static/sounds/defeat.mp3')
        };

        audioCtx.bgmMain.loop = true;  audioCtx.bgmMain.volume = 0.15;
        audioCtx.bgmBattle.loop = true; audioCtx.bgmBattle.volume = 0.15;
        audioCtx.bgmBoss.loop = true;   audioCtx.bgmBoss.volume = 0.2;
        audioCtx.shoot.volume = 0.3;
        audioCtx.megaShoot.volume = 0.5;
        audioCtx.upgrade.volume = 0.6;
        audioCtx.megaBuild.volume = 0.7;
        audioCtx.victory.volume = 0.6;
        audioCtx.defeat.volume = 0.6;

        // BGM 변경 함수
        function switchBGM(newBgm) {
            if (currentBgm === newBgm) return;
            if (currentBgm) currentBgm.pause();

            currentBgm = newBgm;
            if (!isMuted && currentBgm) {
                currentBgm.currentTime = 0;
                currentBgm.play().catch(e => console.log("BGM 재생 보류: ", e));
            }
        }

        // [핵심 변경] 창을 열고 화면 전체(또는 스타트 스크린) 어디든 첫 상호작용이 일어나면 무조건 대기음악 강제 재생
        function initMainBGM() {
            if (!isMuted && !gameActive && currentBgm !== audioCtx.bgmMain) {
                currentBgm = audioCtx.bgmMain;
                currentBgm.play()
                    .then(() => {
                        // 성공적으로 재생되면 이벤트 리스너 제거 (중복 실행 방지)
                        window.removeEventListener('click', initMainBGM);
                        window.removeEventListener('touchstart', initMainBGM);
                    })
                    .catch(e => console.log("브라우저 자동재생 차단 우회 중...", e));
            }
        }
        // 창 열리자마자 사용자가 마우스를 클릭하거나 화면을 터치하는 순간을 감지
        window.addEventListener('click', initMainBGM);
        window.addEventListener('touchstart', initMainBGM);

        function playSound(audioTrack) {
            if (isMuted) return;
            const soundClone = audioTrack.cloneNode();
            soundClone.volume = audioTrack.volume;
            soundClone.play().catch(e => console.log(e));
        }

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('mute-btn');
            if (isMuted) {
                muteBtn.innerText = "🔇";
                if(currentBgm) currentBgm.pause();
            } else {
                muteBtn.innerText = "🔊";
                if (currentBgm && !isPaused) {
                    currentBgm.play().catch(e => console.log(e));
                }
            }
        }

        // --- 경로 설정 ---
        const paths = [
            [{x:0, y:80}, {x:200, y:80}, {x:200, y:180}, {x:400, y:180}, {x:400, y:80}, {x:650, y:80}, {x:650, y:225}, {x:800, y:225}],
            [{x:0, y:370}, {x:250, y:370}, {x:250, y:270}, {x:500, y:270}, {x:500, y:370}, {x:720, y:370}, {x:720, y:225}, {x:800, y:225}]
        ];

        // --- 타워 이미지 로드 ---
        const towerImages = {};
        for(let i=1; i<=15; i++) {
            towerImages[i] = new Image();
            towerImages[i].src = `static/images/tower_${String(i).padStart(2, '0')}.png`;
        }

        const towerNames = ["KF94", "손소독", "자가키트", "열화상", "소독차", "선별소", "조사관", "드라이브", "본부", "치료소", "격리동", "구급단", "집중실", "국가 백신소", "스마트 앰뷸"];
        const towerSpecs = {};

        for(let i=1; i<=15; i++) {
            let baseCost = (i<=5)?300:(i<=10)?1000:3500;
            let finalCost = Math.floor((baseCost + (Math.pow(i, 2.3) * 25)) / 10) * 10;
            if(i === 13) finalCost = 350;
            towerSpecs[i] = {
                id: i, name: towerNames[i-1], cost: finalCost, dmg: 75 + (i * 25),
                range: 155 + (i * 15), fireRate: Math.max(5, 30 - i),
                limit: (i <= 3) ? 15 : (i <= 12) ? 5 : (i === 13) ? 2 : 1,
                isMega: (i >= 14), isBank: (i === 13)
            };
        }
        towerSpecs[14].dmg = 20000;
        towerSpecs[15].dmg = 50000;


        function spawnInstallEffect(x,y,isMega=false){
            effects.push({x,y,r:8,maxR:isMega?95:58,type:'install',alpha:1});
            effects.push({x,y,r:3,maxR:isMega?170:100,type:'install2',alpha:.9});
            for(let i=0;i<(isMega?34:18);i++){
                const a=Math.random()*Math.PI*2, sp=(isMega?2.5:1.3)+Math.random()*3;
                effects.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*2+1,type:'installParticle',alpha:1,color:isMega?'#5df7ff':(Math.random()>.5?'#55ff9a':'#ffd45a')});
            }
            if(isMega){shakeAmount=35;flashAlpha=.28;}
        }
        function spawnShootProjectile(x,y,tx,ty,isMega=false){
            projectiles.push({x,y,tx,ty,life:0,maxLife:isMega?9:7,isMega,trail:[]});
        }
        function createToast(text,kind='info'){
            const b=document.getElementById('alert-banner');
            b.innerText=text;b.dataset.kind=kind;b.style.display='block';
            clearTimeout(createToast.timer);createToast.timer=setTimeout(()=>b.style.display='none',2200);
        }
        function startGame(waves) {
            maxWaves = waves;
            // 게임을 시작하면 대기실 리스너를 확실하게 지워 안전장치 마련
            window.removeEventListener('click', initMainBGM);
            window.removeEventListener('touchstart', initMainBGM);

            document.getElementById('start-screen').style.display = 'none';
            gameActive = true;
            updateStat();
            updateShopUI();

            // 일반 전투 음악으로 전환
            switchBGM(audioCtx.bgmBattle);
            draw();
        }

        function togglePause() {
            if(!gameActive) return;
            isPaused = !isPaused;
            document.getElementById('pause-screen').style.display = isPaused ? 'flex' : 'none';
            if (!isMuted && currentBgm) {
                if (isPaused) currentBgm.pause();
                else currentBgm.play().catch(e => console.log(e));
            }
        }

        function devCheck() {
            devClickCount++;
            if (devClickCount >= 5) {
                document.getElementById('dev-panel').style.display = 'block';
                showAlert("🔓 마스터 디버그 패널 활성화!");
                devClickCount = 0;
            }
        }

        function cheatGold() { gold = 99999999; updateStat(); showAlert("💰 자금이 무한으로 설정되었습니다."); }
        function cheatClearWave() { enemies = []; showAlert("⚡ 현재 웨이브의 바이러스를 박멸했습니다."); }
        function cheatLives() { lives = 9999; updateStat(); showAlert("❤️ 방역 생명력이 무적으로 설정되었습니다."); }
        function cheatOneShot() {

            // Ambient particles keep the battlefield alive without affecting gameplay.
            ambientParticles.forEach(p=>{p.y-=p.v;if(p.y<-4){p.y=454;p.x=Math.random()*800;}p.a=.1+Math.sin((Date.now()/700)+p.x)*.12});
            projectiles=projectiles.filter(p=>{p.life++;p.trail.push({x:p.x,y:p.y});if(p.trail.length>5)p.trail.shift();const k=p.life/p.maxLife;p.x=p.x+(p.tx-p.x)*.42;p.y=p.y+(p.ty-p.y)*.42;return p.life<p.maxLife;});

            placedTowers.forEach(t => { t.dmg = 99999999; });
            for(let id in towerSpecs) { towerSpecs[id].dmg = 99999999; }
            showAlert("🔥 모든 타워가 즉사 데미지로 변경되었습니다.");
        }
        function setGameSpeed(s) { gameSpeed = s; showAlert(`🚀 게임 속도가 ${s}배속으로 설정되었습니다.`); }
        function closeDevPanel() { document.getElementById('dev-panel').style.display = 'none'; }

        canvas.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (800 / rect.width);
            mousePos.y = (e.clientY - rect.top) * (450 / rect.height);
            if(e.pointerType==='touch') e.preventDefault();
        });

        function startWave() {
            if(!gameActive || enemies.length > 0) return;
            wave++;

            if (wave % 10 === 0) {
                createToast(`🚨 WARNING  //  BOSS WAVE ${wave}`);
                switchBGM(audioCtx.bgmBoss);
            } else {
                switchBGM(audioCtx.bgmBattle);
            }

            gold += (300 + (wave * 50) + placedTowers.filter(t=>t.isBank).length * 800);
            updateStat();
            let count = 0;
            let spawnInterval = setInterval(() => {
                if(isPaused) return;
                const pIdx = Math.floor(Math.random() * 2);
                const rand = Math.random();
                let type = "인플루엔자", hpMult = 1, speed = 2.4, color = "lime", size = 28, bounty = 20;

                if (wave % 10 === 0 && count === 0) { type = "COVID-19"; hpMult = 45; speed = 0.9; color = "red"; size = 65; bounty = 1500; }
                else if (rand < 0.2) { type = "노로바이러스"; hpMult = 0.5; speed = 4.8; color = "yellow"; size = 22; bounty = 15; }
                else if (rand < 0.4) { type = "에볼라"; hpMult = 3.5; speed = 1.1; color = "purple"; size = 35; bounty = 50; }

                enemies.push({
                    pIdx, node: 0, x: paths[pIdx][0].x, y: paths[pIdx][0].y,
                    hp: 160 * Math.pow(1.35, wave) * hpMult, maxHp: 160 * Math.pow(1.35, wave) * hpMult,
                    speed, size, type, color, bounty
                });
                if (++count >= 10 + wave) clearInterval(spawnInterval);
            }, 600 / gameSpeed);
        }

        function upgradeTower(idx) {
            const t = placedTowers[idx];
            if(t.level >= 3) return;
            const upgradeCost = Math.floor(t.cost * (t.level === 1 ? 2.5 : 4.0));
            if(gold < upgradeCost) { showAlert(`자금 부족! ($${upgradeCost})`); return; }
            gold -= upgradeCost; t.totalSpent += upgradeCost; t.level++;
            t.dmg *= t.isMega ? 5.0 : 2.5;
            t.fireRate *= 0.6;
            if(t.isMega) shakeAmount = 30;
            effects.push({ x: t.x, y: t.y, r: 10, maxR: t.isMega?300:100, type: 'upgrade', alpha: 1 });
            playSound(audioCtx.upgrade);
            updateStat(); togglePause();
        }

        function sellTower(idx) {
            const t = placedTowers[idx]; gold += Math.floor(t.totalSpent * 0.7);
            placedTowers.splice(idx, 1);
            updateStat(); updateShopUI(); togglePause();
        }

        function draw() {
            if(!gameActive) return;
            for(let step=0; step < (isPaused ? 0 : gameSpeed === 2.5 ? 3 : 1); step++) {
                updateGame();
            }
            render();
            requestAnimationFrame(draw);
        }

        function updateGame() {
            if(shakeAmount > 0) {
                canvas.style.transform = `translate(${(Math.random()-0.5)*shakeAmount}px, ${(Math.random()-0.5)*shakeAmount}px)`;
                shakeAmount *= 0.9;
            } else { canvas.style.transform = `translate(0,0)`; }

            if(flashAlpha > 0) flashAlpha -= 0.05;

            let wasEnemyBefore = enemies.length > 0;

            enemies = enemies.filter(e => {
                let target = paths[e.pIdx][e.node + 1], dist = Math.hypot(target.x - e.x, target.y - e.y);
                if(dist < e.speed) {
                    if(++e.node >= paths[e.pIdx].length - 1) {
                        lives--;
                        updateStat();
                        return false;
                    }
                }
                else { e.x += (target.x - e.x) / dist * e.speed; e.y += (target.y - e.y) / dist * e.speed; }
                if(e.hp <= 0) { gold += e.bounty; updateStat(); return false; }
                return true;
            });

            if(wasEnemyBefore && enemies.length === 0 && gameActive && wave % 10 === 0) {
                switchBGM(audioCtx.bgmBattle);
            }

            summons = summons.filter(s => {
                let targetNode = paths[s.pIdx][s.node - 1];
                let dist = Math.hypot(targetNode.x - s.x, targetNode.y - s.y);
                if (dist < s.speed) { s.node--; if (s.node <= 0) return false; }
                else { s.x += (targetNode.x - s.x) / dist * s.speed; s.y += (targetNode.y - s.y) / dist * s.speed; }
                let hitEnemy = enemies.find(e => Math.hypot(e.x - s.x, e.y - s.y) < 30);
                if (hitEnemy) {
                    hitEnemy.hp -= s.dmg;
                    shakeAmount = 10;
                    effects.push({ x: s.x, y: s.y, r: 10, maxR: 120, type: 'mega', alpha: 1 });
                    playSound(audioCtx.megaShoot);
                    return false;
                }
                return true;
            });

            placedTowers.forEach(t => {
                if(t.isBank) return;
                if(t.cooldown > 0) t.cooldown--;
                else {
                    if(t.id === 15) {
                        const pIdx = Math.floor(Math.random() * 2);
                        const lastNodeIdx = paths[pIdx].length - 1;
                        summons.push({ x: paths[pIdx][lastNodeIdx].x, y: paths[pIdx][lastNodeIdx].y, pIdx, node: lastNodeIdx, speed: 5 + (t.level * 2), dmg: t.dmg, color: "#00ffff" });
                        t.cooldown = t.fireRate * 3;
                        playSound(audioCtx.shoot);
                    } else {
                        let target = enemies.find(e => Math.hypot(e.x-t.x, e.y-t.y) < t.range);
                        if(target) {
                            let currentDmg = t.dmg;
                            if(t.isMega && Math.random() < 0.2) {
                                currentDmg *= 15; flashAlpha = 0.4; shakeAmount = 20;
                                playSound(audioCtx.megaShoot);
                            } else {
                                playSound(t.isMega ? audioCtx.megaShoot : audioCtx.shoot);
                            }
                            target.hp -= currentDmg;
                            t.lastTarget = {x: target.x, y: target.y};
                            spawnShootProjectile(t.x,t.y,target.x,target.y,t.isMega);
                            t.cooldown = t.fireRate;
                            t.effectTimer = 6;
                            if(t.isMega) {
                                enemies.forEach(nearE => { if(nearE !== target && Math.hypot(nearE.x - target.x, nearE.y - target.y) < 120) nearE.hp -= currentDmg * 0.6; });
                                effects.push({ x: target.x, y: target.y, r: 10, maxR: 130, type: 'mega', alpha: 1 });
                            } else {
                                effects.push({ x: target.x, y: target.y, r: 2, maxR: 25, type: 'hit', alpha: 1 });
                                for(let i=0; i<3; i++) effects.push({ x: target.x, y: target.y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, r: 3, type: 'particle', alpha: 1, color: t.id <= 5 ? "#2ecc71" : "#f1c40f" });
                            }
                        }
                    }
                }
            });

            effects = effects.filter(fx => {
                if(fx.type === 'particle' || fx.type === 'installParticle') { fx.x += fx.vx; fx.y += fx.vy; fx.vx*=.98; fx.vy*=.98; fx.alpha -= fx.type==='particle'?.05:.045; fx.r*=.985; }
                else { const step=fx.type==='hit'?3:fx.type==='mega'?15:fx.type==='install'?5:fx.type==='install2'?7:3; fx.r += step; fx.alpha -= fx.type==='install2'?.055:.04; }
                return fx.alpha > 0 && (!fx.maxR || fx.r < fx.maxR+20);
            });
        }

        function render() {
            ctx.fillStyle = "#050505"; ctx.fillRect(0,0,800,450);
            paths.forEach(p => {
                ctx.shadowBlur = 15; ctx.shadowColor = "rgba(255, 255, 255, 0.4)";
                ctx.strokeStyle = "rgba(255, 255, 255, 0.2)"; ctx.lineWidth = 40; ctx.lineJoin = "round"; ctx.lineCap = "round";
                ctx.beginPath(); ctx.moveTo(p[0].x, p[0].y); p.forEach(pt => ctx.lineTo(pt.x, pt.y)); ctx.stroke();
                ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(255, 255, 255, 0.08)"; ctx.lineWidth = 45; ctx.stroke();
            });

            if(flashAlpha > 0) { ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`; ctx.fillRect(0,0,800,450); }


            // Ambient battlefield particles
            ambientParticles.forEach(p=>{ctx.globalAlpha=p.a;ctx.fillStyle='#5df7ff';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;

            // Animated energy paths
            paths.forEach((p,pi)=>{ctx.save();ctx.setLineDash([18,18]);ctx.lineDashOffset=-(Date.now()/45);ctx.strokeStyle=pi===0?'rgba(93,247,255,.24)':'rgba(85,255,154,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.forEach(pt=>ctx.lineTo(pt.x,pt.y));ctx.stroke();ctx.restore();});

            // Projectile trails
            projectiles.forEach(p=>{ctx.save();ctx.lineCap='round';for(let i=1;i<p.trail.length;i++){const q=p.trail[i],prev=p.trail[i-1];ctx.globalAlpha=i/p.trail.length*.7;ctx.strokeStyle=p.isMega?'#5df7ff':'#ffd45a';ctx.lineWidth=p.isMega?5:3;ctx.beginPath();ctx.moveTo(prev.x,prev.y);ctx.lineTo(q.x,q.y);ctx.stroke();}ctx.globalAlpha=1;ctx.shadowBlur=p.isMega?22:10;ctx.shadowColor=p.isMega?'#5df7ff':'#ffd45a';ctx.fillStyle=p.isMega?'#fff':'#ffd45a';ctx.beginPath();ctx.arc(p.x,p.y,p.isMega?6:4,0,Math.PI*2);ctx.fill();ctx.restore();});

            summons.forEach(s => {
                ctx.fillStyle = s.color; ctx.shadowBlur = 15; ctx.shadowColor = s.color;
                ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
            });

            effects.forEach(fx => {
                ctx.beginPath();
                if(fx.type === 'particle' || fx.type === 'installParticle') {
                    ctx.arc(fx.x, fx.y, fx.r, 0, Math.PI*2);
                    ctx.fillStyle = fx.color || '#fff'; ctx.globalAlpha = fx.alpha; ctx.fill(); ctx.globalAlpha = 1.0;
                } else {
                    ctx.arc(fx.x, fx.y, Math.abs(fx.r), 0, Math.PI*2);
                    ctx.strokeStyle = fx.type === 'upgrade' ? `rgba(241,196,15,${fx.alpha})` : fx.type === 'mega' ? `rgba(0,255,255,${fx.alpha})` : fx.type === 'install' ? `rgba(85,255,154,${fx.alpha})` : fx.type === 'install2' ? `rgba(93,247,255,${fx.alpha})` : `rgba(255,255,255,${fx.alpha})`;
                    ctx.lineWidth = fx.type === 'mega' ? 8 : fx.type.startsWith('install') ? 3 : 2; ctx.stroke();
                }
            });

            placedTowers.forEach(t => {
                const size = t.isMega ? 90 : 50;
                if(Math.hypot(t.x - mousePos.x, t.y - mousePos.y) < size/2) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI*2);
                    ctx.fillStyle = t.isMega ? "rgba(0, 255, 255, 0.1)" : "rgba(46, 204, 113, 0.1)"; ctx.fill();
                    ctx.strokeStyle = t.isMega ? "rgba(0, 255, 255, 0.4)" : "rgba(46, 204, 113, 0.4)"; ctx.stroke();
                }
                if(t.isMega) {
                    ctx.shadowBlur = 25; ctx.shadowColor = "#00ffff";
                    ctx.beginPath(); ctx.arc(t.x, t.y, 55, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(0, 255, 255, ${0.4 + Math.sin(Date.now()/100)*0.3})`; ctx.lineWidth = 4; ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                const img = towerImages[t.id];
                if(img.complete && img.naturalWidth !== 0) ctx.drawImage(img, t.x - size/2, t.y - size/2, size, size);
                else { ctx.fillStyle = t.isMega ? "#00ffff" : "#2ecc71"; ctx.fillRect(t.x - size/2, t.y - size/2, size, size); }
                ctx.fillStyle = "#f1c40f"; ctx.font = "bold 16px Arial"; ctx.textAlign="center"; ctx.fillText("★".repeat(t.level), t.x, t.y - size/2 - 10);
                if(t.effectTimer > 0) {
                    ctx.beginPath(); ctx.strokeStyle = t.isMega ? "#00ffff" : "#2ecc71"; ctx.lineWidth = t.isMega ? 8 : 2;
                    ctx.moveTo(t.x, t.y); ctx.lineTo(t.lastTarget.x, t.lastTarget.y); ctx.stroke();
                    t.effectTimer--;
                }
            });

            if(selectedTowerId) {
                const spec = towerSpecs[selectedTowerId];
                const size = spec.isMega ? 90 : 50;
                ctx.beginPath(); ctx.arc(mousePos.x, mousePos.y, spec.range, 0, Math.PI*2);
                const canPlace = gold >= spec.cost;
                ctx.strokeStyle = canPlace ? "rgba(85,255,154,.65)" : "rgba(255,84,112,.7)"; ctx.setLineDash([7,7]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
                ctx.beginPath();ctx.arc(mousePos.x,mousePos.y,Math.max(18,spec.range*.16)+Math.sin(Date.now()/140)*4,0,Math.PI*2);ctx.strokeStyle=canPlace?(spec.isMega?'rgba(93,247,255,.5)':'rgba(85,255,154,.4)'):'rgba(255,84,112,.5)';ctx.stroke();
                ctx.globalAlpha = 0.5;
                const img = towerImages[selectedTowerId];
                if(img.complete && img.naturalWidth !== 0) ctx.drawImage(img, mousePos.x-size/2, mousePos.y-size/2, size, size);
                else { ctx.fillStyle = "#fff"; ctx.fillRect(mousePos.x-size/2, mousePos.y-size/2, size, size); }
                ctx.globalAlpha = 1.0;
            }

            enemies.forEach(e => {
                ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, e.size/2, 0, Math.PI*2); ctx.fill();
                const barW = e.type === "COVID-19" ? 70 : 30;
                ctx.fillStyle = "#333"; ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 12, barW, 7);
                ctx.fillStyle = e.type === "COVID-19" ? "#ff00ff" : "#0f0";
                ctx.fillRect(e.x - barW/2, e.y - e.size/2 - 12, barW * (e.hp/e.maxHp), 7);
            });

            if(lives <= 0) endGame("방역 실패: 변이 바이러스가 확산되었습니다.", false);
            if(wave >= maxWaves && enemies.length === 0 && gameActive) endGame("방역 대성공: 인류를 구했습니다!", true);
        }

        canvas.addEventListener('pointerdown', (e) => {
            if(e.pointerType === 'touch') e.preventDefault();
            const rect = canvas.getBoundingClientRect(), x = (e.clientX - rect.left) * (800 / rect.width), y = (e.clientY - rect.top) * (450 / rect.height);
            let tIdx = placedTowers.findIndex(t => Math.hypot(t.x - x, t.y - y) < (t.isMega?55:25));
            if(tIdx !== -1) {
                const t = placedTowers[tIdx], nextCost = Math.floor(t.cost * (t.level === 1 ? 2.5 : 4.0));
                isPaused = true; document.getElementById('pause-screen').style.display = 'flex';
                if (!isMuted && currentBgm) currentBgm.pause();

                document.getElementById('tower-info-container').innerHTML = `
                    <div id="tower-info">
                        <b style="font-size:20px; color:${t.isMega?'#00ffff':'#2ecc71'};">${t.isMega?'🔥 MEGA UNIT 🔥':''} ${t.name}</b><br>
                        ${t.id === 15 ? '기능: 방역 요원 역출동' : '데미지: ' + Math.floor(t.dmg).toLocaleString()}<br>
                        레벨: ${t.level} / 3<br>
                        <button class="upgrade-btn" onclick="upgradeTower(${tIdx})" ${t.level>=3?'disabled':''}>
                            ${t.level>=3?'업그레이드 완료':'성능 한계 돌파 ($'+nextCost+')'}
                        </button>
                        <button class="sell-btn" onclick="sellTower(${tIdx})">데이터 삭제 (철거)</button>
                    </div>`;
                return;
            }
            if(selectedTowerId) {
                const spec = towerSpecs[selectedTowerId];
                if(gold >= spec.cost) {
                    gold -= spec.cost;
                    if(spec.isMega) {
                        shakeAmount = 50; flashAlpha = 0.5; createToast("☢️ MEGA UNIT DEPLOYED");
                        playSound(audioCtx.megaBuild);
                    }
                    placedTowers.push({ ...spec, x, y, level: 1, cooldown: 0, effectTimer: 0, totalSpent: spec.cost });
                    spawnInstallEffect(x,y,spec.isMega);
                    selectedTowerId = null; updateStat(); updateShopUI();
                } else { showAlert("예산이 부족합니다!"); }
            }
        });

        function updateShopUI() {
            const shopUI = document.getElementById('shop'); shopUI.innerHTML = "";
            for(let i=1; i<=15; i++) {
                const count = placedTowers.filter(t => t.id === i).length, spec = towerSpecs[i], card = document.createElement('div');
                card.className = `tower-card ${selectedTowerId === i ? 'selected' : ''}`;
                if(spec.isMega) card.style.borderColor = "#00ffff";
                card.innerHTML = `<img src="${towerImages[i].src}" onerror="this.src='static/images/tower_01.png'"><b>${spec.name}</b><br>$${spec.cost}`;
                card.onclick = (e) => {
                    if(count < spec.limit) { selectedTowerId = (selectedTowerId === i ? null : i); updateShopUI(); mobileDeployHint(); }
                    else { showAlert("건설 제한 초과!"); }
                    e.stopPropagation();
                };
                shopUI.appendChild(card);
            }
        }


        // Mobile-friendly feedback: prevent the page from stealing gestures while deploying.
        let mobileHintTimer = null;
        function mobileDeployHint(){
            if(!selectedTowerId || window.innerWidth > 700) return;
            const spec=towerSpecs[selectedTowerId];
            showAlert(`👆 ${spec.name} 선택됨 — 맵을 탭해서 설치`);
        }
        window.addEventListener('resize',()=>{
            // Keep the canvas crisp after rotation without changing the game's logical 800x450 coordinate system.
            if(window.innerWidth<=700){ document.body.classList.add('mobile-mode'); }
            else { document.body.classList.remove('mobile-mode'); }
        });

        function showAlert(m) { const b = document.getElementById('alert-banner'); b.innerText = m; b.style.display='block'; setTimeout(()=>b.style.display='none', 2500); }
        function updateStat() { document.getElementById('stat-text').innerText = `자금: $${gold.toLocaleString()} | 생명: ${lives} | 웨이브: ${wave} / ${maxWaves}`; }

        function endGame(text, isVictory) {
            gameActive = false;
            document.getElementById('result-screen').style.display = 'flex';
            document.getElementById('result-title').innerText = text;

            if(currentBgm) currentBgm.pause();
            if(isVictory) playSound(audioCtx.victory);
            else playSound(audioCtx.defeat);
        }
    </script>
</body>
</html>
