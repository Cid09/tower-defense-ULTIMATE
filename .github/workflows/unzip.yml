name: Extract Game ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found."
            exit 0
          fi

          echo "Found: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          if [ -f "extracted/index.html" ]; then
            cp -f "extracted/index.html" "./index.html"
          else
            FOUND_INDEX=$(find extracted -name "index.html" -type f | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp -f "$FOUND_INDEX" "./index.html"
            fi
          fi

          if [ -d "extracted/static" ]; then
            cp -rf extracted/static ./
          else
            FOUND_STATIC=$(find extracted -type d -name "static" | head -n 1)
            if [ -n "$FOUND_STATIC" ]; then
              cp -rf "$FOUND_STATIC" ./
            fi
          fi

          rm -rf extracted
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Extract tower defense game"
          git push
